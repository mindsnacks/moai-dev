name: Build and attach XCFrameworks

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build XCFrameworks
        run: bash xcode/libmoai/build-xcframework.sh -d "$GITHUB_WORKSPACE/build"

      - name: Zip XCFrameworks
        working-directory: build
        run: |
          for xcf in *.xcframework; do
            zip -r "${xcf%.xcframework}.zip" "$xcf"
          done

      - name: Upload release assets
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for zip in build/*.zip; do
            gh release upload "${{ github.event.release.tag_name }}" "$zip"
          done

      - name: Upload workflow artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: MoaiSDK-XCFrameworks
          path: build/*.zip
