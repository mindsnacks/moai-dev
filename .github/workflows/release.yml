name: Build and attach release artifacts

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  ios:
    runs-on: ${{ vars.MACOS_RUNNER }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build XCFrameworks
        run: bash xcode/libmoai/build-xcframework.sh -d "$GITHUB_WORKSPACE/build"

      - name: Zip XCFrameworks
        working-directory: build
        run: |
          for xcf in *.xcframework; do
            zip -r "${xcf%.xcframework}.zip" "$xcf"
          done

      - name: Upload release assets
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for zip in build/*.zip; do
            gh release upload "${{ github.event.release.tag_name }}" "$zip"
          done

      - name: Upload workflow artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: MoaiSDK-XCFrameworks
          path: build/*.zip

  android:
    runs-on: ${{ vars.LINUX_RUNNER }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Build libmoai.so for all ABIs
        working-directory: ant/libmoai
        run: bash build.sh -a all

      - name: Package Android SDK
        run: |
          staging="build/MoaiSDK-Android"
          mkdir -p "$staging/lib"

          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            mkdir -p "$staging/lib/$abi"
            cp "ant/libmoai/libs/$abi/libmoai.so" "$staging/lib/$abi/"
          done

          rsync -a --include='*/' --include='*.h' --exclude='*' src/ "$staging/include/src/"
          rsync -a --include='*/' --include='*.h' --exclude='*' 3rdparty/ "$staging/include/3rdparty/"

          cd build
          zip -r MoaiSDK-Android.zip MoaiSDK-Android

      - name: Upload release assets
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" build/MoaiSDK-Android.zip

      - name: Upload workflow artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: MoaiSDK-Android
          path: build/MoaiSDK-Android.zip
