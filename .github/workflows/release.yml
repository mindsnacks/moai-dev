name: Build and attach release artifacts

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true

jobs:
  create-release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ vars.LINUX_RUNNER }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ inputs.tag }}" --title "${{ inputs.tag }}" --target "${{ github.sha }}"

  ios:
    runs-on: ${{ vars.MACOS_RUNNER }}
    needs: [create-release]
    if: ${{ !cancelled() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build XCFrameworks
        run: bash xcode/libmoai/build-xcframework.sh -d "$GITHUB_WORKSPACE/build"

      - name: Zip XCFrameworks
        working-directory: build
        run: |
          for xcf in *.xcframework; do
            zip -r "${xcf%.xcframework}.zip" "$xcf"
          done

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.tag || github.event.release.tag_name }}"
          for zip in build/*.zip; do
            gh release upload "$tag" "$zip"
          done

  android:
    runs-on: ${{ vars.LINUX_RUNNER }}
    needs: [create-release]
    if: ${{ !cancelled() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Build libmoai.so for all ABIs
        working-directory: ant/libmoai
        run: bash build.sh -a all

      - name: Package Android SDK
        run: |
          staging="build/MoaiSDK-Android"
          mkdir -p "$staging/lib"

          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            mkdir -p "$staging/lib/$abi"
            cp "ant/libmoai/libs/$abi/libmoai.so" "$staging/lib/$abi/"
          done

          rsync -a --include='*/' --include='*.h' --exclude='*' src/ "$staging/include/src/"
          rsync -a --include='*/' --include='*.h' --exclude='*' 3rdparty/ "$staging/include/3rdparty/"

          cd build
          zip -r MoaiSDK-Android.zip MoaiSDK-Android

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.tag || github.event.release.tag_name }}"
          gh release upload "$tag" build/MoaiSDK-Android.zip
